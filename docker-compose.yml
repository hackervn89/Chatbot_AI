services:
  db:
    image: pgvector/pgvector:pg16
    container_name: chatbot-db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-chatbot_db}
      POSTGRES_USER: ${POSTGRES_USER:-chatbot_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD chua duoc cau hinh trong .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U chatbot_user -d chatbot_db" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 45s

  web:
    build: .
    container_name: chatbot-web
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-chatbot_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-chatbot_db}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - ZALO_API_TOKEN=${ZALO_API_TOKEN}
      - SERVER_DOMAIN=${SERVER_DOMAIN}
      - ADMIN_ZALO_IDS=${ADMIN_ZALO_IDS}
      - ZALO_MODE=${ZALO_MODE}
      - ZALO_WEBHOOK_SECRET=${ZALO_WEBHOOK_SECRET}
      - PYTHONUNBUFFERED=1

    volumes:
      - ./taovanban_khoidang/output:/app/taovanban_khoidang/output
      - ./taovanban_khoidang/references:/app/taovanban_khoidang/references

  caddy:
    image: caddy:2-alpine
    container_name: chatbot-caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  pgdata:
  caddy_data:
  caddy_config:
