{% extends "base.html" %}

{% block title %}Đăng nhập - Admin{% endblock %}

{% block content %}
<div class="login-box card">
    <div class="login-header">
        <h2>RAG System Admin</h2>
        <p style="color: var(--text-secondary); font-size: 13px;">Nhập thông tin để quản lý hệ thống tri thức</p>
    </div>

    {% if error %}
    <div class="error-message">
        {{ error }}
    </div>
    {% endif %}

    <form action="/admin/login" method="post">
        <div class="form-group">
            <label for="username">Tên đăng nhập</label>
            <input type="text" id="username" name="username" class="form-control" placeholder="Tên đăng nhập" required autocomplete="username">
        </div>
        <div class="form-group" style="margin-bottom: 24px;">
            <label for="password">Mật khẩu</label>
            <input type="password" id="password" name="password" class="form-control" placeholder="Mật khẩu" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary btn-block">Đăng nhập</button>
    </form>
</div>
{% endblock %}
